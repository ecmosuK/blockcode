name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version from release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          npm version $version --no-git-tag-version
      - run: npm run release
      - name: Match update metadata to installer filename
        shell: pwsh
        run: |
          $metadataPath = Join-Path $PWD "dist/latest.yml"
          $installers = @(Get-ChildItem dist -Filter "*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)." }
          $installerName = $installers[0].Name
          $metadata = Get-Content $metadataPath -Raw
          $updatedMetadata = [regex]::Replace($metadata, '(?m)^(\s*-\s+url:\s*).+$', ('$1' + $installerName))
          $updatedMetadata = [regex]::Replace($updatedMetadata, '(?m)^path:\s*.+$', ('path: ' + $installerName))
          if ($updatedMetadata -eq $metadata) { throw "Could not match the installer path in latest.yml." }
          [IO.File]::WriteAllText($metadataPath, $updatedMetadata, [Text.UTF8Encoding]::new($false))
      - name: Publish GitHub release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assets = Get-ChildItem dist -File | ForEach-Object FullName
          if (-not $assets) { throw "No release assets were produced." }
          gh release create $env:GITHUB_REF_NAME $assets --title "BlockCode $version" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
